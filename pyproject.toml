[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "embedcheck"
version = "0.1.0"
description = "Catch embedding-model regressions (crashes, drift, tokenizer and dtype changes, slowdowns) across library upgrades before you re-index."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["numpy"]

[project.optional-dependencies]
snapshot = ["sentence-transformers"]

[project.scripts]
embedcheck = "embedcheck.cli:main"
